<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-SECTOR K7 /// 數位黑市</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- 自訂樣式與動畫 -->
    <style>
        /* --- 基礎設定 --- */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #050505;
            color: #E0E0E0;
            font-family: 'Roboto Mono', monospace;
            cursor: crosshair; /* 科技十字準星游標 */
            overflow-x: hidden;
        }

        /* --- 字體與主題 --- */
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-text-pink {
            text-shadow: 0 0 5px #F000FF, 0 0 10px #F000FF, 0 0 15px #F000FF;
        }
        
        .neon-text-cyan {
            text-shadow: 0 0 5px #00FFFF, 0 0 10px #00FFFF, 0 0 15px #00FFFF;
        }

        .neon-border-cyan {
            box-shadow: 0 0 10px #00FFFF, inset 0 0 5px #00FFFF;
        }
        
        .neon-border-pink {
            box-shadow: 0 0 10px #F000FF, inset 0 0 5px #F000FF;
        }

        /* --- 載入畫面 --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }
        #loader-text {
            font-family: 'Roboto Mono', monospace;
            color: #00FFFF;
            margin-top: 20px;
            border-right: 2px solid #00FFFF; /* 打字機游標 */
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }

        /* --- 數位雨 Canvas --- */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        /* --- Glitch 故障特效 --- */
        .glitch {
            position: relative;
            font-weight: 900;
            color: white;
            animation: glitch-shake 2.5s infinite linear alternate-reverse;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #F000FF;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00FFFF;
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        /* Glitch 動畫 */
        @keyframes glitch-shake {
            0% { transform: skewX(0deg); }
            5% { transform: skewX(2deg); }
            10% { transform: skewX(-2deg); }
            15% { transform: skewX(0deg); }
            100% { transform: skewX(0deg); }
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(10% 0 80% 0); }
            20% { clip-path: inset(50% 0 10% 0); }
            40% { clip-path: inset(20% 0 30% 0); }
            60% { clip-path: inset(70% 0 5% 0); }
            80% { clip-path: inset(30% 0 60% 0); }
            100% { clip-path: inset(10% 0 80% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(80% 0 10% 0); }
            20% { clip-path: inset(20% 0 70% 0); }
            40% { clip-path: inset(60% 0 20% 0); }
            60% { clip-path: inset(10% 0 50% 0); }
            80% { clip-path: inset(40% 0 30% 0); }
            100% { clip-path: inset(80% 0 10% 0); }
        }

        /* 打字機動畫 */
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #00FFFF }
        }

        /* --- 組件樣式 --- */
        
        /* 掃描線覆蓋 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.02),
                rgba(255, 255, 255, 0.02) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 999;
        }
        
        /* 工業風按鈕 */
        .industrial-button {
            display: inline-block;
            padding: 12px 28px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #00FFFF;
            background: transparent;
            border: 2px solid #00FFFF;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .industrial-button:hover {
            color: #050505;
            background: #00FFFF;
            box-shadow: 0 0 20px #00FFFF;
            transform: translateY(-2px);
        }

        /* NFT 卡片 */
        .nft-card {
            background: rgba(29, 29, 29, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .nft-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px #F000FF, 0 0 10px #F000FF;
            border-color: #F000FF;
        }

        /* 水平數據流 (Featured) */
        .data-stream {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        .data-stream::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* 藝術家卡片 */
        .artist-card {
            background: rgba(29, 29, 29, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .artist-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #CFFF00;
            border-color: #CFFF00;
        }

        /* 全息檔案彈窗 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .holographic-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(10, 25, 47, 0.85); /* 深海軍藍 */
            border: 2px solid #00FFFF;
            box-shadow: 0 0 30px #00FFFF, inset 0 0 15px #00FFFF;
            z-index: 901;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active .holographic-modal {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 頁尾 */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(to top, rgba(0, 255, 255, 0.02), transparent);
        }
        
        .footer-led {
            font-size: 2rem;
            color: #aaa;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .footer-led:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }

    </style>
</head>
